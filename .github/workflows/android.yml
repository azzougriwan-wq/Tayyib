name: Appli Android (APK)

# Fabrique l'APK à chaque modification de l'appli, ou à la main (onglet Actions > Run workflow).
# Le fichier est publié à une adresse fixe :
#   https://github.com/<compte>/<dépôt>/releases/download/android/tayyib.apk
on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "!www/data/**"
      - "scripts/build_web.sh"
      - "scripts/patch_android.py"
      - "resources/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Mettre à jour la liste embarquée
        run: python3 scripts/fetch_osm.py --out www/data/restaurants.json --overrides data/overrides.json || echo "::warning::Liste non mise à jour, l'appli la téléchargera au démarrage"

      - name: Préparer les fichiers de l'appli
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: bash scripts/build_web.sh dist

      - name: Installer Capacitor
        run: npm install --no-audit --no-fund

      - name: Créer le projet Android
        run: |
          npx cap add android
          python3 scripts/patch_android.py android
          npx @capacitor/assets generate --android --assetPath resources \
            --iconBackgroundColor "#0B6B5A" --splashBackgroundColor "#F3F6F5" --splashBackgroundColorDark "#0C1412" \
            || echo "::warning::Icônes non générées, icônes par défaut utilisées"
          npx cap sync android

      - name: Compiler
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Signer l'APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          KS=signing.p12
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | tr -d ' \n\r' | base64 -d > "$KS"
          else
            echo "::warning::Secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD absents : APK signé avec une clé temporaire. Les mises à jour demanderont de désinstaller l'appli."
            KS=temp.p12; KS_PASS=temporaire-$RANDOM$RANDOM
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -alias tayyib -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Tayyib"
          fi
          "$BT/apksigner" sign --ks "$KS" --ks-type PKCS12 --ks-key-alias tayyib \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out tayyib.apk aligned.apk
          "$BT/apksigner" verify tayyib.apk
          rm -f signing.p12 temp.p12
          ls -la tayyib.apk

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android >/dev/null 2>&1; then
            gh release create android --title "Appli Android" \
              --notes "Dernière version de l'appli Tayyib pour Android. Téléchargez tayyib.apk ci-dessous, puis ouvrez-le sur votre téléphone."
          fi
          gh release upload android tayyib.apk --clobber
          echo "APK disponible : https://github.com/${GITHUB_REPOSITORY}/releases/download/android/tayyib.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tayyib-apk
          path: tayyib.apk
